- version: 8.0.1
  title:
    en: Several improvements in COUNTER 5.1 transition and a few bug fixes in CELUS 8.0.1
    cs: Několik vylepšení v přechodu na COUNTER 5.1 a několik oprav chyb v CELUSu 8.0.1
  text:
    en: |
      - COUNTER 5 credentials which can be cloned to COUNTER 5.1 newly indicate if the platform is known to support COUNTER 5.1
      - Cloning of broken credentials to COUNTER 5.1 is now prevented
      - Several small improvements and fixes were introduced
    cs: |
      - COUNTER 5 přihlašovací údaje, které lze klonovat do COUNTER 5.1, nyní indikují, zda je platforma známa podporovat COUNTER 5.1
      - Klonování nefunkčních přihlašovacích údajů do COUNTER 5.1 je nyní zabráněno
      - Bylo provedeno několik drobných vylepšení a oprav
  is_new_feature: FALSE
  is_update: TRUE
  is_bug_fix: TRUE
  notify_users: FALSE

- version: 8.0.0
  title:
    en: COUNTER 5.1 support, CAUL specialized reports and much more arrive in CELUS 8.0
    cs: Podpora pro COUNTER 5.1, nové specializované report a další novinky přináší CELUS 8.0
  text:
    en: |
      - **Support for COUNTER 5.1** was introduced throughout the application
      - A button was added to easily clone COUNTER 5 credentials into their COUNTER 5.1 copy
      - Reporting newly allows comparison of two reports side by side to facilitate exploration of
        **COUNTER 5.1 vs COUNTER 5** data
      - "Potential issues" filter was added to SUSHI credentials management page
      - A specialized report for CAUL (Council of Australian University Librarians) was added
      - Support for **5 new non-COUNTER platforms** was added
      - Many small improvements and fixes were introduced
    cs: |
      - Podpora pro COUNTER 5.1 byla zavedena do celé aplikace
      - Bylo přidáno tlačítko pro snadné klonování COUNTER 5 přihlašovacích údajů do jejich kopie
        COUNTER 5.1
      - Reporting nyní umožňuje porovnání dvou reportů vedle sebe pro usnadnění zkoumání COUNTER 5.1
        vs COUNTER 5 dat
      - Na stránce správy SUSHI přihlašovacích údajů byl přidán filtr "Potenciální problémy"
      - Byl přidán specializovaný report pro CAUL (Council of Australian University Librarians)
      - Byla přidána podpora pro 5 nových non-COUNTER platforem
      - Bylo provedeno mnoho drobných vylepšení a oprav
  is_new_feature: TRUE
  is_update: TRUE
  is_bug_fix: TRUE

- version: 7.0.1
  title:
    en: Bug fix release 7.0.1 is out with better error reporting for non-COUNTER data, more non-COUNTER platforms, and other small improvements
    cs: Opravné vydání 7.0.1 je venku s lepším hlášením chyb pro non-COUNTER data, více non-COUNTER platformami a dalšími drobnými vylepšeními
  text:
    en: |
      - Support for 18 new non-COUNTER platforms was added
      - It is newly possible to mark several SUSHI credentials as fixed at once
      - Error messages for non-COUNTER data were improved to provide more information about the
        cause of the error
      - Several other small improvements and fixes were introduced
    cs: |
      - Byla přidána podpora pro 18 nových non-COUNTER platforem
      - Nově je možné označit naráz několik SUSHI přihlašovacích údajů za opravené
      - Chybové zprávy pro non-COUNTER data byly vylepšeny tak, aby poskytovaly více informací o
        příčině chyby
      - Bylo provedeno několik dalších menších vylepšení a oprav
  is_new_feature: FALSE
  is_update: TRUE
  is_bug_fix: TRUE

- version: 7.0.0
  title:
    en: Version 7.0.0 brings improvements in SUSHI harvesting, more precise overlap analysis, and much more
    cs: Verze 7.0.0 přináší vylepšení v SUSHI harvestingu, přesnější analýzu překryvů a mnohem víc
  text:
    en: |
      - CELUS now looks at past harvests to determine when is the best time to harvest data from
        a platform after a month has ended.
      - Overlap analysis was reworked to ignore usage which does not imply access to the content
        (investigations, denials, etc.), thus giving much more precise results.
      - Warning is newly issued when the same credentials are used for multiple platforms. This
        mitigates a common source of incorrect data.
      - SUSHI management was redesigned for new users to show introductory video if the user does
        not have any credentials yet.
      - We have added 22 new non-COUNTER platforms, primarily focused on medical and legal
        resources, bringing the total number of processable non-COUNTER platforms to 119.
      - Several other improvements and fixes were introduced.
    cs: |
      - CELUS nově používá data z minulých sklízení, aby určil, kdy je nejlepší čas sklízet data z
        platformy po skončení měsíce.
      - Analýza překryvů byla přepracována tak, aby ignorovala použití, které neznamená přístup
        k obsahu (investigations, odmítnutí atd.), čímž poskytuje mnohem přesnější výsledky.
      - CELUS nově varuje v situaci, kdy jsou stejné přihlašovací údaje použity pro více platforem.
        Tím se eliminuje běžný zdroj nesprávných dat.
      - Správa SUSHI byla přepracována pro nové uživatele tak, aby zobrazovala úvodní video, pokud
        uživatel ještě nemá žádné přihlašovací údaje.
      - Přidali jsme 22 nových non-COUNTER platforem, především zaměřených na lékařské a právní
        zdroje, čímž jsme celkový počet zpracovatelných non-COUNTER platforem zvýšili na 119.
      - Bylo provedeno několik dalších vylepšení a oprav.
  is_new_feature: TRUE
  is_update: TRUE
  is_bug_fix: TRUE

- version: 6.1.2
  title:
    en: Version 6.1.2 brings a few bug fixes and small changes
    cs: Verze 6.1.2 přináší několik oprav a drobných změn
  text:
    en: |
      - in reporting, tags from hidden tag classes are no longer shown in the report output when
        "merge rows by tag" is used
      - the "Introductory tour" feature was removed
      - a bug preventing CELUS from properly reacting to SUSHI exception 1020 was fixed
      - an error in reporting causing unresponsive "Run report" button when report type was changed
        under specific conditions was fixed
      - several other small changes, improvements and fixes were introduced
    cs: |
      - v reportingu při použití funkce "sloučení řádků podle štítků" již nejsou ve výstupu
        zobrazeny štítky z tříd štítků, které byly uživatelem označeny jako skryté
      - funkce "Úvodní tour" byla odstraněna
      - byla opravena chyba, která bránila CELUSu správně reagovat na SUSHI výjimku 1020
      - byla opravena chyba v reportingu způsobující neodpovídající tlačítko "Spustit report" při
        změně typu reportu za specifických podmínek
      - bylo provedeno několik dalších drobných změn, vylepšení a oprav
  is_new_feature: FALSE
  is_update: TRUE
  is_bug_fix: TRUE
  notify_users: FALSE

- version: 6.1.1
  title:
    en: Bug fix release 6.1.1 is out
    cs: Opravné vydání 6.1.1 je venku
  text:
    en: |
      - export to COUNTER format is newly visible to all users - not only admins
      - obscure bug in reports with platforms as rows + merging by tag enabled was fixed
      - endless loop of background re-authentication requests after user session expiration was fixed
      - several other small improvements and fixes were introduced
    cs: |
      - export ve formátu COUNTER je nyní viditelný pro všechny uživatele - nejen pro administrátory
      - byla opravena vzácná chyba v reportech s platformami jako řádky + sloučením řádků podle štítků
      - byla opravena nekonečná smyčka pokusů o reautentizaci po vypršení uživatelské relace
      - bylo provedeno několik dalších menších vylepšení a oprav
  is_new_feature: FALSE
  is_update: FALSE
  is_bug_fix: TRUE
  notify_users: FALSE

- version: 6.1.0
  title:
    en: Standard views in reporting, proprietary IDs in title lists, and more in CELUS 6.1.0
    cs: Standardní pohledy v reportingu, proprietary ID v seznamu titulů a mnohem víc v CELUSu 6.1.0
  text:
    en: |
      - You can now apply **[standard view filters](https://support.celus.net/support/solutions/articles/103000284639-how-to-create-a-report-in-celus-)** to reports in reporting with a single click
      - When matching titles against a title list, [**proprietary IDs** are now used as well](https://support.celus.net/support/solutions/articles/103000293855-what-identifiers-of-titles-does-celus-recognise-)
      - Reporting now **warns about summing up metrics** in reports which is a common source of incorrect results
      - Order and labeling of reports in report type selector was changed for better clarity
      - Support for **seven more non-COUNTER reports** was added
      - Many other small improvements and fixes were introduced
    cs: |
      - Nyní můžete na reporty v reportingu jedním kliknutím aplikovat **[filtry standardních pohledů](https://support.celus.net/support/solutions/articles/103000284639-how-to-create-a-report-in-celus-)**
      - Při porovnávání titulů se seznamem titulů jsou nyní používány také [**proprietary ID**](https://support.celus.net/support/solutions/articles/103000293855-what-identifiers-of-titles-does-celus-recognise-)
      - Reporting nyní **varuje při sčítání metrik** v reportech, které může vést k nesprávným výsledkům
      - Pořadí a označení reportů v selektoru typu reportu bylo změněno pro lepší přehlednost
      - Přidána podpora pro **sedm dalších non-COUNTER reportů**
      - Bylo provedeno mnoho dalších menších vylepšení a oprav
  is_new_feature: TRUE
  is_update: TRUE
  is_bug_fix: TRUE
  notify_users: TRUE

- version: 6.0.0
  title:
    en: CELUS version 6.0.0 with COUNTER format export, in-app notifications, fiscal year based dates and much more is here!
    cs: CELUS verze 6.0.0 s exportem ve formátu COUNTER, notifikacemi v aplikaci, daty podle fiskálního roku a mnohem víc je tady!

  text:
    en: |
      - Finished harvests, broken SUSHI credentials and other events newly show as **in-app notifications** with optional desktop notifications
      - You can now **export your data in the COUNTER format** from the platform detail page
      - Set your fiscal year start in the date range selector and use **FY based dates** throughout CELUS
      - Unsuccessful harvests can now be **manually marked as "empty data"** to prevent further harvesting attempts and fix data coverage numbers
      - Email based **two-factor authentication** was added to all accounts for extra security
      - Unless manually overridden, SUSHI server URL will be automatically updated using platform metadata
      - Many other small improvements and fixes were introduced

    cs: |
      - Dokončená sklízení, chybné SUSHI credentials a další události se nově zobrazují jako **notifikace v aplikaci** s možností desktopových notifikací
      - Nyní můžete **exportovat data ve formátu COUNTER** z detailu platformy
      - Nastavte začátek svého fiskálního roku v selektoru dat a používejte **data podle fiskálního roku** v celém CELUSu
      - Neúspěšná sklízení mohou být nyní **ručně označena jako "prázdná data"** pro zabránění dalších pokusů o sklizeň a opravu pokrytí daty
      - K účtům byla přidána **dvoufaktorová autentizace pomocí emailu** pro extra bezpečnost
      - Pokud není ručně přepsáno, URL SUSHI serveru bude automaticky aktualizováno pomocí metadat platformy
      - Bylo provedeno mnoho dalších menších vylepšení a oprav
  is_new_feature: TRUE
  is_update: TRUE
  is_bug_fix: TRUE
  notify_users: TRUE

- version: 5.10.0
  title:
    en: ACRL IPEDS updated for 2023
    cs: ACRL IPEDS aktualizován pro 2023
  text:
    en: |
      This is an intermediate release which brings a **new version of the ACRL IPEDS** report, implementing the 2023 version of the report. It also brings two new **OA (Open Access) tags** for titles from the **DOAJ and DOAB lists**.

      More new features are coming soon in the next release.
    cs: |
      Toto je meziverze, která přináší **novou verzi ACRL IPEDS** reportu pro rok 2023. Přídává také dva nové **OA (Open Access) štítky** pro tituly z **DOAJ a DOAB seznamů**.

      Další nové funkce přijdou brzy v následujícím vydání.
  is_new_feature: TRUE
  is_update: FALSE
  is_bug_fix: TRUE
  notify_users: TRUE


- version: 5.9.1
  title:
    en: Bugfix and performance optimization release 5.9.1
    cs: Opravná a výkonnostní verze 5.9.1
  text:
    en: |
      - performance of several pages, most notably platform overlap, was improved
      - several bugs and minor inconsistencies were fixed
    cs: |
      - byla zvýšena výkonnost několika stránek, především překryvu platforem
      - bylo opraveno několik chyb a drobných nesrovnalostí
  is_new_feature: FALSE
  is_update: TRUE
  is_bug_fix: TRUE
  notify_users: FALSE

- version: 5.9.0
  title:
    en: Easier reharvesting, reporting improvements, and many more non-COUNTER reports arrive with CELUS 5.9.0
    cs: Snazší reharvesting, vylepšení reportingu a mnoho dalších non-COUNTER reportů přichází s CELUSem 5.9.0
  text:
    en: |
      - organization admins in single-library installations now have the ability to **[manage their users](https://support.celus.net/en/support/solutions/articles/103000260180)**
      - **[reharvesting of data](https://support.celus.net/support/solutions/articles/103000054365)** is newly possible **directly from the harvest dialog**
      - several improvements were introduced in reporting - filter values are shown directly in the report list, filters for easier report selection were added, and more
      - the list of non-COUNTER platforms was renamed to **non-SUSHI platforms** and now **[includes 85 platforms](https://support.celus.net/support/solutions/articles/103000096445)**
      - Come have a chat with us at the **ER&L conference 2024** at booth \#306!
      - several other smaller improvements and fixes were introduced
    cs: |
      - správci organizací v instalacích pro individuální knihovny nyní mají možnost **[spravovat své uživatele](https://support.celus.net/en/support/solutions/articles/103000260180)**
      - **[reharvesting dat](https://support.celus.net/support/solutions/articles/103000054365)** je nyní možný **přímo z dialogu pro stahování dat**
      - v reportingu bylo provedeno několik vylepšení - hodnoty filtrů jsou nyní zobrazeny přímo v seznamu reportů, byly přidány filtry pro snazší výběr reportů a další
      - seznam non-COUNTER platforem byl přejmenován na **non-SUSHI platformy** a nyní **[obsahuje 85 platforem](https://support.celus.net/support/solutions/articles/103000096445)**
      - Přijďte si s námi popovídat na **ER&L conference 2024** na stánek \#306!
      - bylo provedeno několik dalších menších vylepšení a oprav
  is_new_feature: TRUE
  is_update: TRUE
  is_bug_fix: TRUE

- version: 5.8.1
  title:
    en: Bugfix release 5.8.1
    cs: Opravná verze 5.8.1
  text:
    en: This release fixes two bugs in processing of COUNTER 5 JSON reports under specific conditions.
    cs: Tato verze opravuje dvě chyby v zpracování COUNTER 5 JSON reportů za specifických podmínek.
  is_new_feature: FALSE
  is_update: FALSE
  is_bug_fix: TRUE
  notify_users: FALSE

- version: 5.8.0
  title:
    en: Tagging improvements, smarter SUSHI harvesting, support for Kanopy non-COUNTER report, and much more in CELUS 5.8.0
    cs: Vylepšení štítkování, chytřejší SUSHI harvesting, podpora non-COUNTER reportů Kanopy a mnoho dalšího v CELUSu 5.8.0
  text:
    en: |
      - support for Kanopy non-COUNTER report was added
      - when tagging title from a file, it is now possible to apply many tags at once by explicitly listing them in the file
      - title lists newly support periodic re-tagging of new titles
      - in reporting it is now possible to filter by tag class - not only by individual tags
      - "last harvestable month" was introduced for SUSHI credentials - CELUS will not try to harvest data for months after this date. It is automatically extracted from failed reports and may be set/overridden by the user.
      - links to knowledgebase articles were added to many CELUS pages - look for the blue questionmark in the lower right corner
      - users can newly see title lists created by other users which are related to tags and tag classes they can assign
      - several other small improvements and fixes were introduced
    cs: |
      - byla přidána podpora pro non-COUNTER report Kanopy
      - při štítkování titulů ze souboru je nyní možné aplikovat více štítků najednou uvedením jednotlivých štítků přímo v souboru
      - titulové seznamy nově podporují pravidelné znovu-zpracování pro označení nových titulů
      - v reportingu je nyní možné filtrovat podle typu štítků - nejen podle jednotlivých štítků
      - byl přidán parametr "poslední stáhnutelný měsíc" pro SUSHI přihlašovací údaje - CELUS se nebude pro pozdější měsíce pokoušet sklízet data. Tento parametr je automaticky extrahován z neúspěšných sklízení a může být nastaven/přepsán uživatelem.
      - na mnoha stránkách CELUSu byly přidány odkazy na články v naší znalostní bázi - hledejte modrý otazník v pravém dolním rohu
      - uživatelé nyní vidí titulové seznamy vytvořené jinými uživateli, které jsou spojeny se štítky a typy štítků, které mohou přiřazovat
      - bylo provedeno několik dalších menších vylepšení a oprav

  is_new_feature: TRUE
  is_update: TRUE
  is_bug_fix: TRUE


- version: 5.7.1
  title:
    en: Bugfix release 5.7.1
    cs: Opravná verze 5.7.1
  text:
    en: This release fixes several smaller bugs.
    cs: Tato verze opravuje několik menších chyb.
  is_new_feature: FALSE
  is_update: FALSE
  is_bug_fix: TRUE
  notify_users: FALSE

- version: 5.7.0
  title:
    en: Adjusting tag visibility, full screen reporting output, faster title tagging and more in CELUS 5.7.0
    cs: Nastavení viditelnosti štítků, zobrazení reportů na celou obrazovku, rychlejší značkování titulů a další v CELUSu 5.7.0
  text:
    en: |
      - in tag management, it is now possible to [hide some tag classes](https://support.celus.net/support/solutions/articles/103000205017) from being listed together with the tagged items (e.g. in reporting output, "All titles", etc.)
      - in reporting, it is now possible to expand the resulting table to whole screen for easier reading
      - the coverage widget in reporting newly links to the coverage overview page
      - export of reports with titles in rows was made much faster
      - reading of title lists from CSV was made significantly faster and fixed for files containing the BOM
      - several other small improvements and fixes were introduced
    cs: |
      - v nastavení štítků je nyní možné [skrýt některé třídy štítků](https://support.celus.net/support/solutions/articles/103000205017), aby se nezobrazovaly společně s označenými položkami (např. ve výstupu z reportingu, "Všechny tituly" atd.)
      - v reportingu je nyní možné rozšířit výslednou tabulku na celou obrazovku pro snazší čtení
      - widget s pokrytím dat v reportingu nyní odkazuje na stránku s přehledem pokrytí
      - export reportů s tituly v řádcích byl výrazně zrychlen
      - načítání seznamů titulů z CSV bylo výrazně zrychleno a opraveno pro soubory obsahující BOM
      - bylo provedeno několik dalších menších vylepšení a oprav

  is_new_feature: TRUE
  is_update: TRUE
  is_bug_fix: TRUE


- version: 5.6.0
  title:
    en: Trend analysis, data coverage in reporting, topic tags and meeting in Charleston - read what's new in CELUS 5.6.0
    cs: Analýza trendů, pokrytí dat v reportech, štítky témat a setkání v Charlestonu - přečtěte si, co je nového v CELUSu 5.6.0
  text:
    en: |
      - Reporting newly contains a [**trend analysis** mode](https://support.celus.net/support/solutions/articles/103000204316) where you can compare data from two time periods
      - **[Reporting now shows data coverage](https://support.celus.net/support/solutions/articles/103000204996)** so that you know how complete the analyzed data are
      - We added topic [tags from the Scopus title list](https://support.celus.net/support/solutions/articles/103000205001) to titles in CELUS
      - The CELUS user interface was slightly cleaned up and improved
      - Come have a **chat with us at the Charleston conference 2023** at booth #16 on the Vendor Showcase Day (7 Nov) or [schedule a meeting with us](https://calendly.com/support-lj8/charleston-conference?month=2023-11)
      - CELUS is now processing **even more non-COUNTER reports**: Hanwen, Embase, Calis, Airiti, Lexis Plus and HeinOnline. See the full list of available non-COUNTER reports [here](https://support.celus.net/support/solutions/articles/103000096445-non-counter-platforms-processing-in-celus)
      - user email validation is now enforced before working with the system
      - many other small and larger improvements and fixes
    cs: |
      - Reporting nově obsahuje mód [**analýzy trendu**](https://support.celus.net/support/solutions/articles/103000204316), ve kterém můžete porovnávat data ze dvou časových období
      - **[Reporting nyní zobrazuje pokrytí dat](https://support.celus.net/support/solutions/articles/103000204996)**, takže víte, jak kompletní jsou analyzovaná data
      - Přidali jsme do CELUSu [štítky témat z titulového seznamu Scopus](https://support.celus.net/support/solutions/articles/103000205001)
      - Uživatelské rozhraní CELUSu bylo mírně vyčištěno a vylepšeno
      - Přijďte si s námi popovídat na **Charleston conference 2023** na stánek #16 na Vendor Showcase Day (7. listopadu) nebo [si s námi domluvte schůzku](https://calendly.com/support-lj8/charleston-conference?month=2023-11)
      - CELUS nyní zpracovává **ještě více non-COUNTER reportů**: Hanwen, Embase, Calis, Airiti, Lexis Plus a HeinOnline. Seznam všech dostupných non-COUNTER reportů najdete [zde](https://support.celus.net/support/solutions/articles/103000096445-non-counter-platforms-processing-in-celus)
      - validace uživatelského emailu je nyní vyžadována před prací se systémem
      - mnoho dalších menších i větších vylepšení a oprav

  is_new_feature: TRUE
  is_update: TRUE
  is_bug_fix: TRUE


- version: 5.5.2
  title:
    en: Bugfix release 5.5.2
    cs: Opravná verze 5.5.2
  text:
    en: |
      - rare bug in reporting which caused some columns to be missing was fixed
      - parsing of COUNTER 4 reports was fixed for specific edge cases
      - the missing `Unique_Item_Requests` metric was added to the COUNTER 5 TR_J1 report view
    cs: |
      - byla opravena vzácná chyba v reportech, která způsobovala, že některé sloupce chyběly
      - byl opraven parsing COUNTER 4 reportů pro specifické okrajové případy
      - do pohledu na COUNTER 5 TR_J1 report byla přidána chybějící metrika `Unique_Item_Requests`
  is_new_feature: FALSE
  is_update: FALSE
  is_bug_fix: TRUE

- version: 5.5.1
  title:
    en: CELUS 5.5.1 adds improved 'Titles on multiple platforms' view to the dedicated coverage overview page and 20 new non-COUNTER platforms from 5.5.0
    cs: CELUS 5.5.1 přídává vylepšený pohled 'Tituly na více platformách' ke stránce s přehledem pokrytí a 20 novými non-COUNTER platformám z 5.5.0
  text:
    en: |
      - The "Titles on multiple platforms" view now shows the span of years of publication from the TR report for each platform and title
      - a bug in title list pagination was fixed - change of filters no longer leads to getting stuck on an empty page
    cs: |
      - Pohled "Tituly na více platformách" nyní zobrazuje rozsah let vydání z TR reportu pro každou platformu a titul
      - byla opravena chyba ve stránkování seznamu titulů - změna filtrů již nevede k uvíznutí na prázdné stránce
  is_new_feature: TRUE
  is_update: FALSE
  is_bug_fix: TRUE

- version: 5.5.0
  title:
    en: CELUS 5.5.0 brings a dedicated page with coverage overview, 20 new non-COUNTER platform reports and much more
    cs: CELUS 5.5.0 přináší stránku s přehledem pokrytí, 20 nových reportů non-COUNTER platforem a mnoho dalšího
  text:
    en: |
      - CELUS is now able to process 20 non-COUNTER platform reports – Choice Reviews, DBpia, eHRAF, Encyclopaedia Britannica, Factiva, Harpweek, ITER, Langenscheidt, Mergent, Naxos, New York Times, OCLC, O’Reilly, SciFinder, SciFinder_n, Statista, Swank, Ulrichsweb, UpToDate and Women Writers Online. You can find all the information about this in the [non-COUNTER platforms section of our Support portal](https://support.celus.net/support/solutions/folders/103000394714).
      - We added a [dedicated page for overview of data coverage](https://support.celus.net/support/solutions/articles/103000115033) throughout the whole system, so you can harvest missing data easily
      - You can now download a [template for importing SUSHI credentials](https://support.celus.net/support/solutions/articles/103000115060)
      - Exports from reporting now include row and column totals
      - You can now export data in Excel format without charts
      - For consortia it is now possible to add alternative names to organizations to be used when importing data for multiple organizations from one report
      - We added a platform filter to the SUSHI management page
      - the `Title overlap` feature newly adds information about the first and last month of available data for each title
      - when deleting SUSHI credentials, it is now possible to delete the related usage data as well
    cs: |
      - CELUS nově umožňuje zpracování 20 reportů non-COUNTER platforem - Choice Reviews, DBpia, eHRAF, Encyclopaedia Britannica, Factiva, Harpweek, ITER, Langenscheidt, Mergent, Naxos, New York Times, OCLC, O’Reilly, SciFinder, SciFinder_n, Statista, Swank, Ulrichsweb, UpToDate a Women Writers Online. Více informací naleznete v [sekci non-COUNTER platforem našeho Support portálu](https://support.celus.net/support/solutions/folders/103000394714).
      - Přidali jsme [stránku pro přehled pokrytí daty](https://support.celus.net/support/solutions/articles/103000115033) v celém systému, takže můžete snadno zjistit, která data chybí
      - Nyní si můžete stáhnout [šablonu pro import SUSHI přihlašovacích údajů](https://support.celus.net/support/solutions/articles/103000115060)
      - Exporty z reportů nyní obsahují řádkové a sloupcové součty
      - Nově je možné exportovat data v Excelu bez grafů
      - Pro konzorcia je nyní možné přidávat alternativní názvy organizací, které se použijí při importu dat pro více organizací z jednoho reportu
      - Na stránce pro správu SUSHI přihlašovacích údajů byl přidán filtr podle platformy
      - Funkce pro analýzu překryvu titulů nyní přidává informace o prvním a posledním měsíci dostupných dat pro každý titul
      - Při mazání SUSHI přihlašovacích údajů je nyní možné smazat i související data o využití
  is_new_feature: TRUE
  is_update: TRUE
  is_bug_fix: TRUE

- version: 5.4.0
  title:
    en: CELUS 5.4.0 brings IPEDS reporting and "Multimedia" interest type
    cs: CELUS 5.4.0 přináší IPEDS reporty a nový typ zájmu "Multimédia"
  text:
    en: |
      - CELUS is now able to calculate your **ACRL IPEDS report** - [read more about it here](https://support.celus.net/support/solutions/articles/103000092778-acrl-ipeds-report)
      - interest type **"Multimedia"** was added
      - **only one set of SUSHI credentials per platform**, organization and COUNTER version is allowed - [more info](https://support.celus.net/support/solutions/articles/103000063863)
      - the title overlap function newly adds info about first and last month of available data for each title
      - an option to delete platform data together with its SUSHI credentials was added
      - as usual some bugs were squashed and things tweaked for better performance
    cs: |
      - CELUS nyní umí vypočítat **ACRL IPEDS report** - [více informací zde](https://support.celus.net/support/solutions/articles/103000092778-acrl-ipeds-report)
      - byl přidán typ zájmu **"Multimédia"**
      - pro platformu, organizaci a verzi COUNTER je nyní povolena **pouze jedna sada SUSHI přihlašovacích údajů** - [více informací](https://support.celus.net/support/solutions/articles/103000063863)
      - funkce pro analýzu překryvu titulů nyní přidává informace o prvním a posledním měsíci dostupných dat pro každý titul
      - při mazání všech dat platformy je nyní možné smazat i její SUSHI přihlašovací údaje
      - jako obvykle byly odstraněny některé chyby a vylepšena výkonnost
  is_new_feature: TRUE
  is_update: TRUE
  is_bug_fix: TRUE

- version: 5.3.0
  title:
    en: Version 5.3.0 with title list overlap analysis and specialized reports
    cs: Verze 5.3.0 s analýzou překryvu titulů a speciálními reporty
  text:
    en: |
      - Overlap analysis – you can now **compare titles** present in your CELUS **with an uploaded list** of titles. [Read more](https://support.celus.net/a/solutions/articles/103000064763).
      - CELUS is now able to generate specialized reports. So far, the **ARL report** used in the USA and the **Rebiun report** required by Spanish libraries are implemented. We are currently preparing the **ACRL/IPEDS** report. [Read more about how to use the specialized reports](https://support.celus.net/support/solutions/articles/103000064738-specialized-reports).
      - It is now possible to **delete a user-created platform** together with all its data.
      - Release dates were added to the changelog and releases pages.
    cs: |
      - Analýza překryvu titulů – nyní můžete **porovnat tituly** v CELUS **s nahraným seznamem titulů**. [Více informací](https://support.celus.net/a/solutions/articles/103000064763).
      - CELUS nyní umí generovat speciální reporty. Zatím jsou k dispozici **ARL report** používaný v USA a **Rebiun report** požadovaný španělskými knihovnami. Aktuálně připravujeme **ACRL/IPEDS**. [Více informací o použití speciálních reportů](https://support.celus.net/support/solutions/articles/103000064738-specialized-reports).
      - Nově je možné **smazat uživatelsky vytvořenou platformu** spolu s jejími daty.
      - Datum vydání bylo přidáno do changelogu a stránky s vydáními.
  is_new_feature: TRUE
  is_update: TRUE
  is_bug_fix: TRUE

- version: 5.2.2
  title:
    en: Version 5.2.2 + our new User forum & knowledgebase
    cs: Verze 5.2.2 + naše nové uživatelské fórum & znalostní báze
  text:
    en: |
      - CELUS is able to automatically fill in the SUSHI `platform` attribute for platforms which require it.
      - There are several bug fixes and optimizations.
      - We opened a new [User forum & knowledgebase](https://support.celus.net/support/discussions).
    cs: |
      - CELUS umí automaticky doplnit SUSHI parametr `platform` pro platformy, které ho vyžadují.
      - Přidali jsme několik oprav a optimalizací.
      - Otevřeli jsme nové [uživatelské fórum & znalostní bázi](https://support.celus.net/support/discussions)
  is_new_feature: FALSE
  is_update: TRUE
  is_bug_fix: TRUE

  links:
    - title:
        en: Visit the User forum & knowledgebase
        cs: Na uživatelské fórum & znalostní bázi
      link: https://support.celus.net/support/discussions

