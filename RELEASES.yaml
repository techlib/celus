  title:
    en: Version 5.2.1 brings several bug fixes and optimizations
    cs: Verze 5.2.1 přináší několik oprav a optimalizací
  text:
    en: This release brings several bug fixes and optimizations.
    cs: Tato verze přináší několik oprav a optimalizací.
