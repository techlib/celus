.on_python_changes:
  rules: &on_python_changes_rules
    - if: '$CI_COMMIT_BRANCH == "plus"'
      when: on_success
    - changes:
      - apps/**/*
      - config/**/*
      - test_fixtures/**/*
      - poetry.lock
      - CHANGELOG.md
      - RELEASES.yaml
      when: on_success
    - when: never


tests:run_tests:
  stage: tests
  needs: []
  image: registry.gitlab.com/big-dig-data/celus/celus-test:latest
  services:
    - postgres
    - redis
    - name: clickhouse/clickhouse-server:25.7.4
      alias: clickhouse
  variables:
    FF_NETWORK_PER_BUILD: 1  # to make services see each other
    DJANGO_SETTINGS_MODULE: config.settings.test
    POSTGRES_DB: celus
    POSTGRES_USER: celus
    POSTGRES_PASSWORD: celus
    POSTGRES_HOST: postgres
    REDIS_URL: "redis://redis:6379/1"
    CELERY_BROKER_URL: "redis://redis:6379/"
    REQUEST_LOGGING_REDIS_HOST: redis
    CLICKHOUSE_DB: celus_test
    CLICKHOUSE_USER: celus
    CLICKHOUSE_PASSWORD: celus
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_PORT: 9000
  before_script:
    - poetry install --no-root
  script:
    - cp .env.example .env
    - poetry run pytest -v -n 4 --create-db --junitxml=report.xml --cov=activity --cov=annotations --cov=api --cov=charts --cov=core --cov=cost --cov=erms --cov=logs --cov=organizations --cov=publications --cov=sushi --cov=recache --cov=knowledgebase --cov=tags --cov-report=xml --cov-report=term apps/
  artifacts:
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  coverage: /^TOTAL.*\s+([^\s]+)%$/
  rules: *on_python_changes_rules
  tags:
    - bdd

tests:load_initial_data:
  stage: tests
  needs: []
  image: registry.gitlab.com/big-dig-data/celus/celus-test:latest
  services:
    - postgres
    - redis
  variables:
    DJANGO_SETTINGS_MODULE: config.settings.test
    POSTGRES_DB: celus_loaddata
    POSTGRES_USER: celus_loaddata
    POSTGRES_PASSWORD: celus_loaddata
    POSTGRES_HOST: postgres
    REDIS_URL: "redis://redis:6379/1"
    CLICKHOUSE_SYNC_ACTIVE: "false"
  before_script:
    - poetry install --no-root
  script:
    - cp .env.example .env
    - poetry run python manage.py migrate
    - poetry run python manage.py loaddata data/initial-data.json
  rules: *on_python_changes_rules
  tags:
    - bdd

tests:run_tests:registry:
  stage: tests
  needs: []
  image: registry.gitlab.com/big-dig-data/celus/celus-test:latest
  services:
    - postgres
    - redis
  variables:
    DJANGO_SETTINGS_MODULE: config.settings.test_registry
    POSTGRES_DB: celus
    POSTGRES_USER: celus
    POSTGRES_PASSWORD: celus
    POSTGRES_HOST: postgres
    REDIS_URL: "redis://redis:6379/1"
    CELERY_BROKER_URL: "redis://redis:6379/"
  before_script:
    - poetry install --no-root -E registry
  script:
    - cp .env.example .env
    - poetry run pytest --counter-registry -v --create-db --junitxml=report.xml --cov=counter_registry --cov-report=xml --cov-report=term apps/
  artifacts:
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  coverage: /^TOTAL.*\s+([^\s]+)%$/
  rules: *on_python_changes_rules
  tags:
    - bdd
