lints:pre_commit:
  stage: lints
  needs: []
  image: registry.gitlab.com/big-dig-data/celus/celus-test:latest
  services:
    - postgres
  variables:
    DJANGO_SETTINGS_MODULE: config.settings.test
    POSTGRES_DB: celus
    POSTGRES_USER: celus
    POSTGRES_PASSWORD: celus
    POSTGRES_HOST: postgres
    UV_CACHE_DIR: .uv-cache
  before_script:
    - cp .env.example .env
  script:
    - uv run --active pre-commit run --hook-stage push --all-files
  tags:
    - bdd
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - $UV_CACHE_DIR
