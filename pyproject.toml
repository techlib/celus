[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"

[tool.black]
line-length = 100
skip-string-normalization = true
target-version = ["py38"]

[tool.ruff]
line-length = 101
ignore = [
    "A001", # Variable `Warning` is shadowing a Python builtin
    "A002", # Argument `id` is shadowing a Python builtin
    "A003", # Class attribute `list` is shadowing a Python builtin
    "DJ008",  # model does not have __str__ method
    "F811", # redefinition of unused '...'
]
select = [
    'A',  # flake8-builtins
    'B',  # flake8-bugbear
    'DJ', # flake8-django
    'E',  # pycodestyle - errors
    'F',  # pyflakes
    'I',  # isort
    'W',  # pycodestyle - warnings
]
target-version = "py38"  # same as black
fixable = ['I001']  # isort: imports are incorrectly sorted

[tool.ruff.per-file-ignores]
"test_*.py" = ["B011"]  # test files should have asserts

[tool.poetry]
name = "celus"
version = "5.8.1"
description = "web application for harvesting and visualization of usage data of electronic information sources"
authors = ["Beda Kosata <beda@bigdigdata.com>", "Stepan Henek <stepan@bigdigdata.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.8.9"

celery = "~5.3.1"
celus-nibbler = "~10.1.3"
celus-nigiri = "~1.3.3"
celus-pycounter = "~4.0.1"
colorlog = "^6.7.0"
dateparser = "^1.1.8"
diskcache = "^5.4.0"
dj-rest-auth = "~5.0.1"
Django = "~4.2.6"
django-allauth = "~0.58.0"
django-anymail = "^10.2"
django-cachalot = "~2.6.1"
django-celery-results = "~2.5.0"
django-colorfield = "^0.9.0"
django-impersonate =  "~1.9.1"
django-import-export = "^3.0.2"
django-ipware = "^5.0.0"
django-modeltranslation = "~0.18.7"
django-mptt = "~0.14.0"  # django-mptt 0.15 requires python 3.9
django-postgres-copy = "^2.7.0"
django-prometheus = "~2.3.1"
django-redis = "^5.4.0"
django-requestlogs = "^0.7.1"
django-reversion = "~5.0.4"
django-test-migrations = "^1.1.0"
djangorestframework = "~3.14.0"
djangorestframework-api-key = "^3.0.0"
drf-nested-routers = "~0.93.4"
hcube = "0.12.0"
isbnlib = "^3.10.3"
lz4 = "~4.3.2"
openpyxl = "~3.1.2"
pandas = "^2.0.3"  # pandas 2.1 requires python 3.9
Pillow = "^10.0.1"
prometheus-client = "^0.17.1"
psutil = "~5.9.4"
psycopg2-binary = "~2.9.1"
pydantic = "^2"
pyparsing = "^3.0.9"
python-dateutil = "^2.8.2"
python-decouple = "^3.3"
python-magic = "~0.4.15"
pytz = "*"
pyyaml = "^6.0.1"
redis = "^5"
requests = "^2.23.0"
rest-pandas = "~1.1.0"
semantic-version = "~2.10.0"
sentry-sdk = "^1.23.0"
toml = "^0.10.2"
XlsxWriter = "^3.0.3"
zstandard = "^0.21.0"

[tool.poetry.group.dev.dependencies]
black = "^23.10.1"
clickhouse-driver = "^0.2.6"
deptry = "^0.12.0"
dj-inmemorystorage = "^2.1.0"
django-debug-toolbar = "^4.0.0"
django-extensions = "^3.1.3"
django-querycount = "^0.8.3"
django-webtest = "^1.9.7"
factory-boy = "^3.2.1"
Faker = "^19.3.0"
filelock = "^3.12.2"
freezegun = "^1.2.2"
pre-commit = "^3.3.1"
pydot = "^1.4.2"
pyfakefs = "^5.0.0"
pytest = "^7.2.0"
pytest-cov = "^4.0.0"
pytest-django = "^4.2.0"
pytest-env = "^0.8.1"
pytest-random-order = "^1.1.0"
pytest-xdist = "^3.3.0"
requests-mock = "~1.11.0"
ruff = "^0.1.1"
sphinx = "^7.1.0"  # sphinx 7.2 requires python 3.9
watchdog = {extras = ["watchmedo"], version = "^3.0.0"}

[tool.deptry]
known_first_party = ["test_scenarios"]

[tool.deptry.per_rule_ignores]
# the following are used internally by django
DEP002 = [
    'colorlog',
    'django-anymail',
    'django-ipware',
    'django-redis',
    'django-test-migrations',
    'lz4',
    'Pillow',
    'psycopg2-binary',
    'python-decouple',
    'pytz',
    'sentry-sdk',
    'toml',
]
# the following are used in tests only, so it does not matter if they are in dev deps only
DEP004 = [
    "pytest",
    "freezegun",
    "faker",
    "factory",
    "clickhouse_driver",  # used to setup the test tables
    "filelock",  # used to lock clickhouse test from writing over each other
    "requests_mock"
]
