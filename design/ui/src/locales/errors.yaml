en:
  E100: It is not possible to group by explicit dimension unless that dimension is shared by all selected report types.
  E101: The number of possible columns is too large ({group_count}). Please refine the report configuration.
  E102: The specified primary dimension ({dimension}) is not supported.
  E103: The specified primary dimension ({dimension}) is not valid.
  E104: The attribute 'primary_dimensions' or 'primary_dimension' must be present in the request.
  E105: The attribute 'dimension' must be present in the request.
  E106: At least one dimension must be selected to define the output columns.
  E107: The queried dimension is not supported.
  E108: Part was not specified when requesting split report.
  E109: Part specification is not compatible with the requested splitting of the report.
  E110: Part was specified for report without splitting.
  E111: Only date filters are supported for subsets in trend mode.
  E112: There are too many possible parts, please refine you configuration.
  E113: Dimension is not common to all used report types.
  E114: Tag roll up is not supported when multiple primary dimensions are used.
  E115: Include all zero rows is not supported when multiple primary dimensions are used.
  E116: Trend mode is not supported when multiple primary dimensions are used.
  E117: When merging reports, exactly two reports must be selected.
  E118: Report type filter must be specified when explicit dimension filter is used.

cs:
  E100: Není možné vytvořit sloupce z rozměru, který není společný pro všechny vybrané typy reportů.
  E101: Počet sloupců je příliš velký ({group_count}). Upravte prosím nastavení reportu.
  E102: Vybraný primární rozměr ({dimension}) není podporovaný.
  E103: Vybraný primární rozměr ({dimension}) není platný.
  E104: Požadavek musí obsahovat atribut 'primary_dimensions' nebo 'primary_dimension'.
  E105: Požadavek musí obsahovat atribut 'dimension'.
  E106: Musí být vybrán alespoň jeden rozměr definující sloupce výstupu.
  E107: Dotazovaný rozměr není podporovaný.
  E108: Specifickace části nebyla součástí požadavku i přesto, že je požadován rozdělený report.
  E109: Specifikace části není kompatibilní s požadovaným dělením reportu.
  E110: Specifikace části byla zadána pro report i přesto, že není požadován rozdělený report.
  E111: Pouze filtry pro datum jsou podporovány pro podmnožiny v trendovém režimu.
  E112: Počet možných částí je příliš velký, upravte prosím konfiguraci reportu.
  E113: Rozměr není společný pro všechny použité typy reportů.
  E114: Tag roll up není podporován, pokud je použito více primárních rozměrů.
  E115: Include all zero rows není podporováno, pokud je použito více primárních rozměrů.
  E116: Trendový režim není podporován, pokud je použito více primárních rozměrů.
  E117: Pokud je vybráno sloučení reportů, musí být vybrány právě dva reporty.
  E118: Filtr pro typ reportu musí být zadaný, pokud je použit explicitní filtr pro rozměr.
