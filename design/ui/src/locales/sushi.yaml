en:
  sushi:
    all_counter_versions: All
    enabled: Automatic harvesting
    enabled_tooltip: When turned on, data for these credentials get automatically downloaded each month.
    state:
      unknown: Unknown
      queued: Waiting for data
      error: Error
      success: Success
      missing: Not harvested yet
      empty_data: Empty data
      broken: Broken credentials
      broken_report: Broken report
      running: Fetching data
      deleted: Data was deleted
      broken_sushi: Broken SUSHI credentials
      waiting: Waiting
      awaiting_import: Being imported
      import_failed: Data import failed
      partial_data: Partial data

    state_desc:
      unknown: The state is not clear. There was no obvious error but no data were imported.
      queued: Data was not yet available so future attempts were queued.
      error: There was an error downloading data.
      success: Data were successfully downloaded and ingested into CELUS.
      missing: Data retrieval was not yet performed.
      empty_data: Data was successfully harvested, but no usage was recorded at the time in question.
      broken: The credentials are marked as broken and thus automatic harvesting is turned off.
      broken_report: The report is marked as broken and thus automatic harvesting is turned off.
      running: This harvest is currently running.
      deleted: Data was downloaded but deleted from the database afterwards.
      broken_sushi: The SUSHI credentials were marked as broken. Download is postponed until the credentials are fixed.
      last_harvestable_month: Last harvestable month
      last_harvestable_month_set_by_user: Last harvestable month was se by user.
      last_harvestable_month_set_by_harvest: Last harvestable month was supplied by publisher in a SUSHI response.
      waiting: Waiting for download - either planned for future or waiting for a free download slot.
      awaiting_import: Data was downloaded and is currently being imported into the database.
      import_failed: Data was downloaded but importing it into database failed.
      partial_data: Data was downloaded and imported, but it might not be complete.
      canceled: Download was canceled.
      bug: Date are missing and can't be downloaded because credentials are broken.
      not_harvestable: Data for this date are no longer available from SUSHI server.

    broken: Broken
    broken_report_type_desc: |
      This report was marked as broken for these credentials. This is usually result of errors
      during harvesting of data which indicate credentials are correct, but report is not supported.
      Automatic harvesting is disabled for such reports.
    knowledgebase_report_type_desc: This report was successfully harvested by other users for this platform.
    registry_report_type_desc: According to the COUNTER registry, this report is supported by the selected platform.
    mark_as_fixed:
      title: Mark credentials as fixed
      success: Credentials were marked as fixed.
      button: Mark as fixed
      tooltip: If you think that the selected credentials should not be marked as broken anymore, you can manually mark them as fixed.
    clone_to_newer:
      title: Clone to COUNTER 5.1
      success: Credentials were cloned to newer version of COUNTER.
      button: Clone to 5.1
      tooltip: Create a copy of selected credentials with the COUNTER version upgraded to 5.1.
      info: Create a copy of the selected <strong>{count}</strong> credentials with the COUNTER version upgraded to 5.1.
      alert_text_p1: Support for COUNTER 5.1 among publishers is still far from universal. While CELUS lets you clone any of your COUNTER 5 credentials to COUNTER 5.1, we at present recommend to only do so for platforms that are known to support COUNTER 5.1.
      alert_text_p2: For more information, see the {link}.
      link_text: knowledge base article
    update:
      can_update_tt: These COUNTER 5 credentials do not have a COUNTER 5.1 version and can be cloned into a COUNTER 5.1 copy
      cannot_update_broken_tt: These COUNTER 5 credentials are broken and cannot be cloned to COUNTER 5.1
      can_update_legend_header: "COUNTER 5 credentials which do not have a COUNTER 5.1 counterpart and can be cloned are marked with one of the following symbols:"
      can_update_legend: The status of COUNTER 5.1 for {count} platform is unknown | The status of COUNTER 5.1 for {count} platforms is unknown
      can_update_verified_legend: Platform is known to support COUNTER 5.1
      cannot_update_broken_legend: Credentials are broken and cannot be cloned
      i_am_sure: I really want to clone the selected credentials to COUNTER 5.1, even though the platform may not yet support it.
      harvest_new_credentials: Harvest data for the new credentials

cs:
  sushi:
    all_counter_versions: Všechny
    enabled: Automatické stahování
    enabled_tooltip: Pokud je tato volba zapnutá, budou se data pro tyto přihlašovací údaje pravidelně automaticky stahovat.
    state:
      unknown: Neznámý
      queued: Čekáme na data
      error: Chyba
      success: Úspěšně staženo
      missing: Dosud nestaženo
      empty_data: Prázdná data
      broken: Nefunkční přihlašovací údaje
      broken_report: Nefunkční report
      running: Data se stahují
      deleted: Data byla smazána
      broken_sushi: Nefunkční přihlašovací údaje
      waiting: Čeká
      awaiting_import: Právě se importuje
      import_failed: Import dat selhal
      partial_data: Nekompletní data

    state_desc:
      unknown: Stav není jednoznačný. Nedošlo ke zjevné chybě, ale import neobsahoval žádná data.
      queued: Data zatím nebyla k dispozici, bylo naplánováno další stažení v budoucnosti.
      error: Došlo k chybě při stahování dat.
      success: Data byla úspěšně stažená a uložená v systému.
      missing: Stažení dat zatím nebylo provedeno.
      empty_data: Data byla úspěšně stažena, ale pro dané obdobi nebylo zaznamenáno žádné využití.
      broken: Přihlašovací údaje byly označeny jako nefunkční a automatické stahování pro ně bylo vypnuto.
      broken_report: Report byl označeny jako nefunkční a automatické stahování pro něj bylo vypnuto.
      running: Toto stahování právě probíhá.
      deleted: Data byla stažena, ale později byla smazána z databáze.
      broken_sushi: Přihlašovací údaje pro SUSHI byly označeny jako nefunkční. Stahování bylo pozastaveno dokud nebudou přihlašovací údaje opraveny.
      last_harvestable_month: Poslední stáhnutelný měsíc
      last_harvestable_month_set_by_user: Nejstarší měsíc, který lze stáhnout, byl nastaven uživatelem.
      last_harvestable_month_set_by_harvest: Nejstarší měsíc, který lze stáhnout, byl získán od vydavatele v SUSHI datech.
      waiting: Čeká na stahování - buď bylo naplánováno na později nebo čeká ve frontě.
      awaiting_import: Data byla stažena a nyní jsou importována do databáze.
      import_failed: Data byla stažena, ale import dat do databáze selhal.
      partial_data: Data byla stažena a naimportována, ale nemusí být kompletní.
      canceled: Stahování bylo zrušeno.
      bug: Chybí data a nemůžou být stažena, protože přihlašovací údaje byly označeny jako nefunkční.
      not_harvestable: Data za toto období již nejsou ze SUSHI serveru k dispozici.

    broken: Nefunkční
    broken_report_type_desc: |
      Tento report byl označen jako nefunkční. Většinou je to způsobeno chybami při stahování, které indikují, že
      přihlašovací údaje jsou funkční, ale report není podporovaný.
      Automatické stahování je pro tyto reporty vypnuté.
    knowledgebase_report_type_desc: Tento report byl na této platformě úspěšně stažený jiným uživatelem.
    registry_report_type_desc: Podle COUNTER registru je tento report podporován pro vybranou platformu.
    mark_as_fixed:
      title: Označ přístupové údaje jako opravené
      success: Přístupové údaje byly označeny jako opravené.
      button: Označ jako opravené
      tooltip: Pokud se domníváte, že by vybrané přihlašovací údaje neměly být označeny jako nefunkční, můžete je označit jako opravené.
    clone_to_newer:
      title: Naklonuj do COUNTERu 5.1
      success: Přístopové údaje byly naklonovány s novou verzí COUNTERu.
      button: Naklonuj do 5.1
      tooltip: Vytvořit kopii vybraných přístupových údajů s COUNTER verzí povýšenou na 5.1
      info: Vytvořit kopii vybraných <strong>{count}</strong> přístupových údajů s COUNTER verzí povýšenou na 5.1.
      alert_text_p1: Podpora COUNTER 5.1 mezi vydavateli zatím není univerzální. I když vám CELUS umožňuje naklonovat libovolné přístupové údaje COUNTER 5 do COUNTER 5.1, doporučujeme v současné době tak učinit pouze pro platformy, které jsou známy jako podporující COUNTER 5.1.
      alert_text_p2: Pro více informací navštivte {link}.
      link_text: znalostní bázi
    update:
      can_update_tt: Tyto přístupové údaje pro COUNTER 5 lze naklonovat do kopie pro COUNTER 5.1
      cannot_update_broken_tt: Tyto přístupové údaje pro COUNTER 5 jsou nefunkční a nelze je naklonovat do COUNTER 5.1
      can_update_legend_header: "Přístupové údaje pro COUNTER 5, které nemají verzi pro COUNTER 5.1 a lze je naklonovat, jsou označeny jedním z následujících symbolů:"
      can_update_legend: Stav COUNTER 5.1 pro {count} platformu je neznámý |
        Stav COUNTER 5.1 pro {count} platformy je neznámý |
        Stav COUNTER 5.1 pro {count} platforem je neznámý
      can_update_verified_legend: Platforma podporuje COUNTER 5.1
      cannot_update_broken_legend: Přístupové údaje jsou nefunkční a nelze je naklonovat
      i_am_sure: Opravdu chci naklonovat vybrané přístupové údaje do COUNTER 5.1, i když platforma nemusí být ještě podporována.
      harvest_new_credentials: Stáhnout data pro nové přístupové údaje
