default_stages: [pre-push, pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.4.0
    hooks:
      - id: trailing-whitespace
        exclude: '^.*\.(tsv|json|svg)'
      - id: end-of-file-fixer
        exclude: '^.*\.(tsv|json|svg)'
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.9.7
    hooks:
      - id: uv-lock

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff formatter
        entry: uv run ruff format
        language: system
        types: [python]

      - id: ruff
        name: ruff linter
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: pytestnow
        name: Check that no tests marked with 'now' exist
        entry: "@pytest.mark.now"
        language: pygrep
        types: [python]

      - id: django-migrations
        name: Check django migrations
        entry: uv run python manage.py makemigrations --check --no-input
        language: system
        types: [python]
        pass_filenames: false

      - id: deptry
        name: Check pyproject.toml dependencies
        entry: uv run deptry apps
        language: system
        files: ^pyproject\.toml|.*\.py$
        pass_filenames: false


  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: "v3.1.0"
    hooks:
      - id: prettier
        files: ^design/
